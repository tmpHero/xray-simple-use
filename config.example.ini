# xray-simple-use configuration
# Copy this file to config.ini and edit your settings:
#   cp config.example.ini config.ini
#   chmod 600 config.ini

[server]
# VLESS share link from v2rayN (keep full URL, including vless:// prefix)
vless_url = vless://YOUR_UUID@example.com:443?encryption=none&security=tls&type=ws&host=example.com&path=%2Fws

[daemon]
# Hour for daily full rescan (0-23)
daily_scan_hour = 5
# Health check interval in seconds
health_interval = 30
# Consecutive failures before triggering failover
failure_threshold = 3
# Cooldown for failed IPs in seconds (10 min default)
cooldown_seconds = 600
# Maximum cooldown after repeated failures (2 hours)
max_cooldown_seconds = 7200
# Start background candidate supplement when only this many IPs are available
replenish_threshold = 2
# Trigger emergency scan when only this many IPs are available
emergency_threshold = 1

[cfst]
# CloudflareSpeedTest concurrency threads (-n)
concurrency = 30
# Tests per IP (-t)
attempts = 2
# Number of top candidate IPs to keep in queue
candidate_count = 5
# Skip download speed test for faster scanning (-dd)
skip_download = true
# Maximum acceptable latency in ms (-tl)
max_latency_ms = 500

[test]
# Real-link test requests per candidate IP
attempts = 3
# Per-request timeout in seconds
timeout_seconds = 5
# URL for health check and candidate probing (must return HTTP 204)
probe_url = https://www.gstatic.com/generate_204
